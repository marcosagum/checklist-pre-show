<title>Checklist Operacional Farmasi Arena</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap">
<style>
/* Visual do calendário da arena (farmasi-arena-mapa): barra vermelho-escura no topo, Onest,
   títulos em maiúsculas, cartões brancos bem arredondados e botões em pílula */
:root{
  --paper:#f6f5f3; --card:#ffffff; --ink:#0a0a0a; --muted:#717784; --line:#e6e8ec; --ghost:#d7dae1;
  --band:#a10f12; --band-ink:#ffffff; --brand:#e11518; --brand-deep:#a10f12; --brand-light:#ed7374;
  --note:#e11518; --note-bg:#fdecec;
  --ok:#15803d; --ok-bg:#e4f4ea; --no:#e11518; --no-bg:#fdecec; --na:#b45309; --na-bg:#fdf0da;
  --chip:#eeece9; --focus:#ed7374;
  --r-card:24px; --r-lg:32px; --r-pill:999px; --r-field:12px;
  --ease-spring:cubic-bezier(0.34,1.56,0.64,1); --ease-quart:cubic-bezier(0.25,1,0.5,1);
  --f-display:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}

body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
::selection{background:var(--brand);color:#fff}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* barra do topo, igual à Navbar do calendário */
.band{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--band);color:var(--band-ink);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band-in{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:12px;min-height:64px;padding-block:10px}
.mark{width:44px;height:44px;flex:none;display:block;border-radius:8px}
.brand-t{font-size:16px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;line-height:1.1;white-space:nowrap}
.brand-s{display:inline-block;margin-top:3px;font-size:10px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:var(--r-pill);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.7)}
.tabs{margin-left:auto;display:flex;gap:4px}
.tab{background:transparent;border:0;color:rgba(255,255,255,.6);padding:8px 16px;border-radius:var(--r-pill);font-weight:500;font-size:12px;letter-spacing:.05em;text-transform:uppercase;transition:background .2s,color .2s}
.tab:hover{color:#fff;background:rgba(255,255,255,.1)}
.tab[aria-current="page"]{color:#fff;background:rgba(255,255,255,.15)}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 80px}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);font-weight:500;margin:0;text-wrap:balance;text-transform:uppercase}
h1{font-size:34px;line-height:.95;letter-spacing:-.025em}
h2{font-size:12px;letter-spacing:.22em;color:var(--muted);display:inline-flex;align-items:center;gap:8px}
h2::before{content:"";width:6px;height:6px;border-radius:var(--r-pill);background:var(--brand);flex:none}
.muted{color:var(--muted)}
.small{font-size:13px}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card)}
.panel-pad{padding:24px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grow{flex:1 1 auto;min-width:0}

.fld{display:flex;flex-direction:column;gap:8px;font-size:11px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);flex:1 1 180px;min-width:0}
input[type=text],input[type=date],input[type=password],input[type=number],textarea{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-field);padding:11px 14px;font-size:15px;width:100%;min-width:0;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink);transition:border-color .2s}
input[type=text]:focus,input[type=date]:focus,input[type=password]:focus,input[type=number]:focus,textarea:focus{border-color:var(--brand-light);outline:none}
textarea{resize:vertical;min-height:80px}

.btn{border:1px solid var(--line);background:var(--card);border-radius:var(--r-pill);padding:0 20px;font-weight:500;font-size:12px;letter-spacing:.05em;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;color:var(--ink);transition:background .2s,color .2s,border-color .2s}
.btn:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-deep);border-color:var(--brand-deep)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--chip);color:var(--ink);border-color:var(--chip)}
.btn.danger{color:var(--no)}
.btn.danger:hover{background:var(--no);color:#fff;border-color:var(--no)}
.btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn[disabled]{opacity:.5;cursor:not-allowed;pointer-events:none}
.link{background:none;border:none;padding:4px 0;color:var(--muted);font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:color .2s}
.link:hover{color:var(--ink)}

/* Lista de shows */
.shows{display:flex;flex-direction:column}
.show{display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:center;padding:20px 24px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%;transition:background .2s}
.show:first-child{border-top:0;border-radius:var(--r-card) var(--r-card) 0 0}
.show:last-child{border-radius:0 0 var(--r-card) var(--r-card)}
.show:only-child{border-radius:var(--r-card)}
.show:hover{background:var(--paper)}
.show-t{font-weight:500;font-size:19px;text-transform:uppercase;letter-spacing:-.01em;min-width:0;overflow-wrap:anywhere}
.show-m{font-size:13px;color:var(--muted);grid-column:1}
.show-p{grid-column:2;grid-row:1 / span 2;text-align:right;font-variant-numeric:tabular-nums;font-size:26px;font-weight:500;letter-spacing:-.02em}
.bar{height:6px;background:var(--chip);border-radius:var(--r-pill);overflow:hidden;display:flex;grid-column:1 / -1}
.bar i{display:block;height:100%}
.bar .b-ok{background:var(--ok)} .bar .b-na{background:var(--na)} .bar .b-no{background:var(--no)}
.chip{display:inline-block;font-size:10px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:var(--r-pill);background:var(--chip);color:var(--muted);vertical-align:middle}
.chip.done{background:var(--ok-bg);color:var(--ok)}

/* Checklist */
.head{display:flex;flex-direction:column;gap:8px}
.sticky{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));z-index:5;background:var(--paper);padding-block:12px;margin-block:-12px;border-bottom:1px solid var(--line)}
.sum{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-variant-numeric:tabular-nums;font-size:13px}
.sum b{font-size:18px;font-weight:500}
.k-ok{color:var(--ok)} .k-no{color:var(--no)} .k-na{color:var(--na)}
.pct{font-weight:500;font-size:30px;letter-spacing:-.03em;margin-left:auto}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.fchip{border:1px solid var(--line);background:var(--card);border-radius:var(--r-pill);padding:7px 14px;font-size:11px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;transition:background .2s,color .2s}
.fchip:hover{border-color:var(--ink)}
.fchip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden}
.sec-h{padding:20px 24px 16px;font-weight:500;font-size:20px;letter-spacing:-.01em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.sec-h::before{content:"";width:8px;height:8px;border-radius:var(--r-pill);background:var(--brand);flex:none}
.grp-h{background:var(--chip);padding:9px 24px;font-weight:500;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px;border-top:1px solid var(--line)}
.grp-h .cnt{margin-left:auto;font-weight:500;letter-spacing:.05em;color:var(--muted);font-variant-numeric:tabular-nums}

.item{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:4px 12px;padding:12px 20px 12px 14px;border-top:1px solid var(--line);align-items:start;border-left:4px solid transparent}
.grp-h + .item{border-top:0}
.item.s-ok{border-left-color:var(--ok)} .item.s-nao{border-left-color:var(--no)} .item.s-na{border-left-color:var(--na)}
.num{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;text-align:right;padding-top:11px}
.txt{padding-top:9px;overflow-wrap:anywhere}
.nota{color:var(--note)}
.obs-t{color:var(--note);background:var(--note-bg);font-size:13px;margin-top:6px;overflow-wrap:anywhere;border:1px dashed var(--note);border-radius:var(--r-field);padding:5px 10px;text-align:left;display:inline-flex;align-items:center;gap:6px;max-width:100%}
.obs-t:hover{border-style:solid}
.obs-t svg{flex:none}
.obs-in{margin-top:8px;color:var(--note);font-size:14px;padding:9px 12px}
.acts{display:flex;gap:6px;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r-pill);overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;min-width:46px;height:42px;font-weight:500;font-size:15px;color:var(--muted);border-left:1px solid var(--line);transition:background .2s,color .2s}
.seg button:first-child{border-left:0;padding-left:4px}
.seg button:last-child{padding-right:4px}
.seg button.na{font-size:11px;letter-spacing:.04em}
.seg button:hover{background:var(--chip);color:var(--ink)}
.seg button[aria-pressed="true"].ok{background:var(--ok);color:#fff}
.seg button[aria-pressed="true"].nao{background:var(--no);color:#fff}
.seg button[aria-pressed="true"].na{background:var(--na);color:#fff}
.obs-b{border:1.5px solid var(--note);background:var(--note-bg);border-radius:var(--r-pill);height:42px;padding:0 14px;font-size:11px;font-weight:600;color:var(--note);letter-spacing:.06em;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;gap:5px;min-width:80px;transition:background .2s,color .2s}
.obs-b:hover{background:var(--note);color:#fff}
.obs-b.has{background:var(--note);color:#fff}
.obs-b:active{transform:translateY(1px)}
.ro .seg button,.ro .obs-b{cursor:default}

/* Editor */
.ed-item{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:6px 12px;padding:12px 20px 12px 14px;border-top:1px solid var(--line);align-items:start}
.ed-f{display:flex;flex-direction:column;gap:6px;min-width:0}
.ed-f input.nota-in{color:var(--note);font-size:14px;padding:8px 12px}
.ed-btns{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.ib{border:1px solid var(--line);background:var(--card);border-radius:var(--r-pill);min-width:38px;height:38px;font-weight:500;color:var(--muted);padding:0 10px;font-size:12px;transition:background .2s,color .2s,border-color .2s}
.ib:hover{color:#fff;background:var(--ink);border-color:var(--ink)}
.ib.del{color:var(--no)}
.ib.del:hover{background:var(--no);border-color:var(--no);color:#fff}
.ib.confirm{background:var(--no);color:#fff;border-color:var(--no)}
.ib[disabled]{opacity:.35;pointer-events:none}
.sec-h input,.grp-h input{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-field);color:var(--ink);font-family:inherit;font-size:inherit;font-weight:inherit;letter-spacing:inherit;text-transform:inherit;padding:6px 12px;flex:1 1 auto;min-width:0}
.grp-h input{background:var(--card)}
.addbar{padding:12px 20px 14px 58px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:8px}
.addbar .row{gap:8px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px}
.chk input{width:18px;height:18px;accent-color:var(--brand)}

.empty{padding:32px 20px;text-align:center;color:var(--muted)}
.notice{border:1px solid rgba(180,83,9,.3);background:var(--na-bg);color:var(--ink);padding:12px 16px;border-radius:var(--r-field);font-size:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)}
.legend span b{display:inline-block;min-width:28px;text-align:center;border-radius:var(--r-pill);color:#fff;font-size:11px;font-weight:500;padding:2px 6px;margin-right:4px}
.copybox textarea{min-height:200px;font-size:13px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:12px 20px;border-radius:var(--r-pill);font-size:13px;font-weight:500;z-index:20;max-width:calc(100% - 32px)}

/* Montagens */
select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:var(--r-field);padding:10px 12px;font-size:15px;width:100%;min-width:0;text-transform:none;letter-spacing:0;font-weight:400}
select:focus{border-color:var(--brand-light);outline:none}
.lig-sel{font-size:13px;padding:7px 10px;color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:var(--r-pill);margin-right:8px;vertical-align:middle;flex:none}
.dot.big{width:14px;height:14px;margin-right:10px;vertical-align:4px}
.mont-chip{margin-top:8px;display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);background:var(--paper);border-radius:var(--r-pill);padding:6px 12px;font-size:12px;font-weight:500;color:var(--ink);max-width:100%;text-align:left}
.mont-chip:hover{border-color:var(--ink)}
.mont-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.mont-card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;text-align:left;padding:0;transition:border-color .2s,transform .3s var(--ease-quart)}
.mont-card:hover{border-color:var(--ghost);transform:translateY(-2px)}
.mont-thumb{display:block;height:140px;background-size:cover;background-position:center}
.mont-info{display:flex;flex-direction:column;gap:6px;padding:16px 18px 18px}
.mont-t{font-weight:500;font-size:17px;text-transform:uppercase;letter-spacing:-.01em;display:flex;align-items:center}
.legenda-mont{display:flex;flex-wrap:wrap;gap:4px 18px}
.planta{display:flex;flex-direction:column;gap:6px}
.planta-ctrl{display:flex;align-items:center;gap:6px}
.planta-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r-field);background:#fff;max-height:75vh;-webkit-overflow-scrolling:touch}
.planta-in{position:relative;min-width:100%}
.planta-in img{display:block;width:100%;height:auto;max-width:none;user-select:none;-webkit-user-select:none}
.planta-in svg{position:absolute;inset:0;width:100%;height:100%}
.planta-in svg.desenhando{cursor:crosshair}
.planta-vazia{padding:28px 18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r-field)}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:10px}
.fotos img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--r-field);background:var(--chip)}
.foto-ed{position:relative}
.foto-ed .ib{position:absolute;top:6px;right:6px;background:var(--card)}
.foto-add{display:grid;place-items:center;aspect-ratio:4/3;border:1.5px dashed var(--ghost);border-radius:var(--r-field);color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;text-align:center;padding:8px}
.foto-add:hover{border-color:var(--ink);color:var(--ink)}
table.mat{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}
table.mat th{text-align:left;font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
table.mat td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.mat tr:last-child td{border-bottom:0}
table.mat .q{width:90px}
table.mat td.q{font-variant-numeric:tabular-nums;font-weight:500;font-size:16px}
.panel-pad > .fld{flex:none}
.qtd-in{width:80px;padding:7px 10px}
.mat-ed{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;padding:12px;border:1px solid var(--line);border-radius:var(--r-field)}
.mat-ed .fld{flex:1 1 150px}
.cores{display:flex;flex-wrap:wrap;gap:8px}
.cor{width:34px;height:34px;border-radius:var(--r-pill);border:3px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.cor.on{box-shadow:0 0 0 2px var(--ink)}
ul.lig{margin:10px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:8px}

@media (max-width:600px){
  h1{font-size:28px}
  .brand-t{font-size:14px;letter-spacing:.14em}
  .tab{padding:8px 12px}
  .band-in{gap:10px}
  .mark{width:38px;height:38px}
  .panel-pad{padding:18px}
  .sec-h{padding:16px 18px 12px;font-size:17px}
  .grp-h{padding:8px 18px}
  .item{grid-template-columns:24px minmax(0,1fr);padding:12px 16px 12px 10px}
  .acts{grid-column:2;justify-content:flex-start}
  .ed-item{grid-template-columns:24px minmax(0,1fr);padding:12px 16px 12px 10px}
  .ed-btns{grid-column:2;justify-content:flex-start}
  .addbar{padding-left:16px;padding-right:16px}
  .pct{font-size:24px}
  .show{padding:16px 18px}
}
@media (max-width:480px){
  .brand-t{display:none}
  .brand-s{display:none}
  .tab{padding:7px 9px;font-size:11px;letter-spacing:.03em}
  .mark{width:34px;height:34px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

    <div class="grow" style="min-width:0">
      <div class="brand-t">Farmasi Arena</div>
      <div class="brand-s">Checklist pré-show</div>

    <nav class="tabs" id="tabs">
      <button class="tab" data-a="go-lista" id="tab-lista">Shows</button>
      <button class="tab" data-a="go-mont" id="tab-mont" hidden>Montagens</button>
      <button class="tab" data-a="go-modelo" id="tab-modelo">Modelo</button>
    </nav>
  </div>
</header>
<main><div class="wrap" id="app"><div class="panel empty">Carregando checklists…</div></div></main>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
const app = document.getElementById('app');
const toastEl = document.getElementById('toast');
const STATUS = { ok:{sym:'✓', label:'Feito'}, nao:{sym:'✗', label:'Não feito'}, na:{sym:'N/A', label:'Não se aplica'} };

let db = null, dl = null, canWrite = true;
const S = {
  view: 'lista', openId: null,
  modelo: undefined, lista: undefined,
  filtro: 'todos', editando: false,
  obsAbertas: new Set(), addForm: null, confirm: null,
  draft: {}, novo: { evento:'', data:'', resp:'' },
  copyText: null, semDb: false, lento: false, erro: '',
  montagens: undefined, plantas: {}, montId: null, mDraft: null, mEdit: false, mNovo: false,
  ferramenta: null, linhaAtual: [], zoom: 1, nivelPlanta: 0, voltar: null, enviando: 0
};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const clone = o => JSON.parse(JSON.stringify(o));
const fmtData = d => { if (!d) return ''; const [y,m,dd] = d.split('-'); return `${dd}/${m}/${y}`; };
const val = (id, fallback) => (id in S.draft ? S.draft[id] : (fallback ?? ''));

let toastT;
function toast(msg){ toastEl.textContent = msg; toastEl.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => toastEl.hidden = true, 2600); }
function errMsg(e){
  const c = e && e.code;
  if (c === 'invalid_argument') return 'Você não tem permissão para alterar este checklist.';
  if (c === 'proibido') return 'Esta senha só permite marcar os itens e escrever observações.';
  if (c === 'quota_exceeded') return 'O espaço de dados ficou cheio. Exclua checklists antigos.';
  if (c === 'resource_exhausted') return 'Muitas alterações seguidas. Espere um instante e tente de novo.';
  return 'Não foi possível salvar. Verifique a conexão e tente de novo.';
}

// Uma gravação por vez em cada documento
const filas = {};
function gravar(path, fn){
  const p = (filas[path] || Promise.resolve()).then(fn).catch(e => {
    if (e && e.code === 'unavailable') return new Promise(r => setTimeout(r, 400 + Math.random()*600)).then(fn).catch(e2 => toast(errMsg(e2)));
    if (e && e.code === 'invalid_argument') canWrite = false;
    toast(errMsg(e));
  });
  filas[path] = p; return p;
}

// ---------- contagem ----------
function itensDe(secoes){ const out=[]; (secoes||[]).forEach(s => (s.grupos||[]).forEach(g => (g.itens||[]).forEach(i => out.push(i)))); return out; }
function contar(ck){
  const c = { total:0, ok:0, nao:0, na:0, vazio:0 };
  itensDe(ck.secoes).forEach(i => { c.total++; const s = ck.estado?.[i.id]?.s || ''; if (s) c[s]++; else c.vazio++; });
  c.pct = c.total ? Math.round((c.ok + c.na) / c.total * 100) : 0;
  return c;
}
const atual = () => (S.lista || []).find(c => c.id === S.openId);
// A senha da equipe só marca itens e escreve observações; criar, editar e excluir é do administrador
const podeMudar = () => canWrite && S.papel !== 'equipe';
function acessoInfo(){
  if (!servidor || !S.papel) return '';
  if (S.papel === 'equipe') return `<p class="small muted" style="margin:0">Acesso da equipe: marcar itens e escrever observações. <button class="link" data-a="pedir-admin">Entrar como administrador</button></p>`;
  return `<p class="small muted" style="margin:0">Acesso de administrador. <button class="link" data-a="sair">Sair</button></p>`;
}

// ---------- render ----------
// Não troca a tela no meio de um toque, senão o toque se perde
let dedoNaTela = false, renderPendente = false;
document.addEventListener('pointerdown', () => { dedoNaTela = true; }, true);
document.addEventListener('pointercancel', () => { dedoNaTela = false; if (renderPendente) render(); }, true);
document.addEventListener('pointerup', () => { setTimeout(() => { dedoNaTela = false; if (renderPendente) render(); }, 0); }, true);
document.addEventListener('click', () => { dedoNaTela = false; }, true);
function render(){
  if (dedoNaTela) { renderPendente = true; return; }
  renderPendente = false;
  const ae = document.activeElement;
  const foco = ae && ae.id && app.contains(ae) ? { id: ae.id, a: ae.selectionStart, b: ae.selectionEnd } : null;
  const pw = document.getElementById('planta-wrap');
  const rolagem = pw ? [pw.scrollLeft, pw.scrollTop] : null;
  const emMont = S.view === 'montagens' || S.view === 'montagem';
  document.getElementById('tab-lista').setAttribute('aria-current', S.view === 'lista' || S.view === 'check' ? 'page' : 'false');
  document.getElementById('tab-mont').setAttribute('aria-current', emMont ? 'page' : 'false');
  document.getElementById('tab-modelo').setAttribute('aria-current', S.view === 'modelo' ? 'page' : 'false');
  document.getElementById('tab-mont').hidden = !servidor;
  let html = '';
  if (S.pedirSenha) html = viewSenha();
  else if (S.semDb) html =`<div class="panel empty">Abra esta página pelo link do claude.ai, conectado à sua conta, para ver e salvar os checklists.</div>`;
  else if (S.view === 'modelo') html = viewModelo();
  else if (S.view === 'montagens') html = viewMontagens();
  else if (S.view === 'montagem') html = viewMontagem();
  else if (S.view === 'check' && atual()) html = viewCheck(atual());
  else html = viewLista();
  app.innerHTML = html;
  const pw2 = document.getElementById('planta-wrap');
  if (pw2 && rolagem) { pw2.scrollLeft = rolagem[0]; pw2.scrollTop = rolagem[1]; }
  if (foco){ const el = document.getElementById(foco.id); if (el){ el.focus(); try { if (foco.a != null) el.setSelectionRange(foco.a, foco.b); } catch(_){} } }
}

function avisoCarga(){
  if (S.erro) return `<div class="notice">${esc(S.erro)}</div>`;
  if (S.lento) return `<div class="notice">Os dados ainda não chegaram. Verifique a conexão; a página continua tentando.</div>`;
  return '';
}

function viewLista(){
  const modeloVazio = S.modelo !== undefined && !itensDe(S.modelo?.secoes).length;
  const form = podeMudar() ? `
  <section class="panel panel-pad" aria-labelledby="h-novo">
    <div class="head" style="margin-bottom:12px"><h2 id="h-novo">Novo checklist de pré-show</h2>
      <span class="muted small">Cria uma cópia do modelo fixo. O que você mudar no show não altera o modelo.</span></div>
    <form id="f-novo" class="row" style="align-items:flex-end">
      <label class="fld">Show / evento<input type="text" id="n-evento" required placeholder="Ex.: JÃO" value="${esc(S.novo.evento)}"></label>
      <label class="fld" style="flex:0 1 170px">Data do show<input type="date" id="n-data" value="${esc(S.novo.data)}"></label>
      <label class="fld">Responsável<input type="text" id="n-resp" placeholder="Quem está fazendo" value="${esc(S.novo.resp)}"></label>
      <button class="btn pri" type="submit" ${modeloVazio ? 'disabled' : ''}>Criar checklist</button>
    </form>
    ${modeloVazio ? `<p class="small muted" style="margin:10px 0 0">O modelo está vazio. Monte os itens na aba <b>Modelo</b> primeiro.</p>` : ''}
  </section>` : '';
  let lista;
  if (S.lista === undefined) lista = `<div class="empty">Carregando…</div>`;
  else if (!S.lista.length) lista = podeMudar()
    ? `<div class="empty">Nenhum checklist ainda. Preencha o nome do show acima e toque em <b>Criar checklist</b>.</div>`
    : `<div class="empty">Nenhum checklist ainda. O administrador cria o checklist de cada show.</div>`;
  else lista = `<div class="shows">${S.lista.map(ck => {
    const c = contar(ck), t = c.total || 1;
    return `<button class="show" data-a="abrir" data-id="${esc(ck.id)}">
      <span class="show-t">${esc(ck.evento || 'Sem nome')} ${ck.finalizado ? '<span class="chip done">Concluído</span>' : ''}</span>
      <span class="show-p">${c.pct}%</span>
      <span class="show-m">${[fmtData(ck.data), ck.responsavel].filter(Boolean).map(esc).join(' · ') || 'Sem data'} · ${c.ok} feitos${c.nao ? ` · ${c.nao} não feitos` : ''}${c.vazio ? ` · ${c.vazio} sem marcação` : ''}</span>
      <span class="bar" aria-hidden="true"><i class="b-ok" style="width:${c.ok/t*100}%"></i><i class="b-na" style="width:${c.na/t*100}%"></i><i class="b-no" style="width:${c.nao/t*100}%"></i></span>
    </button>`; }).join('')}</div>`;
  return `${avisoCarga()}${form}
  <section aria-labelledby="h-shows" style="display:flex;flex-direction:column;gap:10px">
    <h2 id="h-shows">Shows</h2>
    <div class="panel">${lista}</div>
  </section>
  ${acessoInfo()}`;
}

function itemVisivel(ck, it){
  const e = ck.estado?.[it.id] || {};
  if (S.filtro === 'pend') return e.s !== 'ok' && e.s !== 'na';
  if (S.filtro === 'obs') return !!e.obs;
  return true;
}

function viewCheck(ck){
  const c = contar(ck);
  const ro = !canWrite;
  const adm = podeMudar();
  const topo = `
  <div class="head">
    <button class="link" data-a="go-lista">← Todos os shows</button>
    <div class="row"><h1 class="grow">${esc(ck.evento || 'Sem nome')}</h1>${ck.finalizado ? '<span class="chip done">Concluído</span>' : ''}</div>
    <div class="muted">${[fmtData(ck.data) || 'Sem data', ck.responsavel ? 'Resp.: ' + ck.responsavel : ''].filter(Boolean).map(esc).join(' · ')}</div>
  </div>
  <div class="sticky">
    <div class="sum">
      <span class="k-ok"><b>${c.ok}</b> feitos</span>
      <span class="k-no"><b>${c.nao}</b> não feitos</span>
      <span class="k-na"><b>${c.na}</b> N/A</span>
      <span class="muted"><b>${c.vazio}</b> sem marcação</span>
      <span class="pct">${c.pct}%</span>
    </div>
    <div class="row" style="margin-top:8px;justify-content:space-between">
      <div class="filters" role="group" aria-label="Filtrar itens">
        ${[['todos','Todos'],['pend','Pendentes'],['obs','Com observação']].map(([k,l]) => `<button class="fchip" data-a="filtro" data-v="${k}" aria-pressed="${S.filtro===k}">${l}</button>`).join('')}
      </div>
      ${adm ? `<button class="btn ${S.editando ? 'on' : ''}" data-a="editar">${S.editando ? 'Concluir edição' : 'Editar itens'}</button>` : ''}
    </div>
  </div>
  <div class="legend"><span><b style="background:var(--ok)">✓</b>Feito</span><span><b style="background:var(--no)">✗</b>Não feito</span><span><b style="background:var(--na)">N/A</b>Não se aplica neste show</span><span>Toque de novo para desmarcar.</span></div>`;

  const corpo = S.editando && adm ? editor(ck.secoes, 'check') : (ck.secoes || []).map(sec => {
    const grupos = (sec.grupos || []).map(g => {
      const its = (g.itens || []).map((it, idx) => ({ it, idx })).filter(x => itemVisivel(ck, x.it));
      if (!its.length && S.filtro !== 'todos') return '';
      const feitos = (g.itens||[]).filter(i => ['ok','na'].includes(ck.estado?.[i.id]?.s)).length;
      return `${g.titulo ? `<div class="grp-h">${esc(g.titulo)}<span class="cnt">${feitos}/${(g.itens||[]).length}</span></div>` : ''}
        ${its.map(({it, idx}) => itemRow(ck, it, idx, ro)).join('')}`;
    }).join('');
    if (!grupos.trim()) return '';
    return `<section class="sec"><div class="sec-h">${esc(sec.titulo)}</div>${grupos}</section>`;
  }).join('') || `<div class="panel empty">Nenhum item neste filtro.</div>`;

  const mat = materialDoShow(ck);
  const material = mat.linhas.length ? `
  <section class="panel panel-pad" style="display:flex;flex-direction:column;gap:10px">
    <div class="row"><h2 class="grow">Material do show</h2><span class="pct" style="font-size:22px">${mat.total} peças</span></div>
    <table class="mat"><tbody>${mat.linhas.map(([k, q]) => `<tr><td class="q">${q}</td><td>${esc(k)}</td></tr>`).join('')}</tbody></table>
    <p class="small muted" style="margin:0">Soma dos ${mat.montagens} modelos de montagem ligados aos itens deste show. Item marcado N/A não entra.</p>
  </section>` : '';

  const rodape = `${material}
  <section class="panel panel-pad" style="display:flex;flex-direction:column;gap:12px">
    <label class="fld">Observações gerais do show
      <textarea id="obs-geral" ${ro ? 'readonly' : ''} placeholder="Ex.: cliente pediu balcão extra no nível 1">${esc(val('obs-geral', ck.obsGeral))}</textarea></label>
    <div class="row">
      ${adm ? `<button class="btn ${ck.finalizado ? '' : 'pri'}" data-a="finalizar">${ck.finalizado ? 'Reabrir checklist' : 'Marcar como concluído'}</button>` : ''}
      <button class="btn" data-a="copiar">Copiar resumo</button>
      ${dl ? `<button class="btn" data-a="baixar">Baixar para imprimir</button>` : ''}
      <span class="grow"></span>
      ${!adm ? '' : (S.confirm === 'del-ck'
        ? `<span class="small">Excluir de vez?</span><button class="btn danger" data-a="del-ck">Sim, excluir</button><button class="btn ghost" data-a="cancel">Não</button>`
        : `<button class="btn ghost danger" data-a="del-ck">Excluir checklist</button>`)}
    </div>
    ${S.copyText ? `<div class="copybox"><p class="small muted" style="margin:0 0 6px">Não deu para copiar sozinho. Selecione o texto abaixo e copie:</p><textarea id="copy-fallback" readonly>${esc(S.copyText)}</textarea></div>` : ''}
  </section>`;
  return `${avisoCarga()}${topo}${corpo}${rodape}`;
}

function itemRow(ck, it, idx, ro){
  const e = ck.estado?.[it.id] || {};
  const s = e.s || '';
  const obsId = 'o-' + it.id;
  const obs = val(obsId, e.obs);
  const aberta = S.obsAbertas.has(it.id);
  return `<div class="item ${s ? 's-' + s : ''} ${ro ? 'ro' : ''}">
    <span class="num">${idx + 1}</span>
    <div style="min-width:0">
      <div class="txt">${esc(it.texto)} ${it.nota ? `<span class="nota">${esc(it.nota)}</span>` : ''}</div>
      ${it.montagem && montagem(it.montagem) ? (() => { const m = montagem(it.montagem); return `<button class="mont-chip" data-a="go-mont-det" data-mid="${esc(m.id)}"><i class="dot" style="background:${m.cor || CORES[0]}"></i>Ver montagem · ${esc(resumoMont(m, ck))}${(m.fotos || []).length ? ` · ${m.fotos.length} foto${m.fotos.length === 1 ? '' : 's'}` : ''}</button>`; })() : ''}
      ${aberta && !ro
        ? `<input type="text" class="obs-in" id="${obsId}" data-iid="${esc(it.id)}" placeholder="Observação deste show (ex.: 78 grades)" value="${esc(obs)}">`
        : (obs ? `<button class="obs-t" data-a="obs" data-iid="${esc(it.id)}" ${ro ? 'disabled' : ''} title="Toque para editar a observação"><span>obs: ${esc(obs)}</span>${ro ? '' : '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>'}</button>` : '')}
    </div>
    <div class="acts">
      <div class="seg" role="group" aria-label="Situação">
        ${['ok','nao','na'].map(k => `<button class="${k}" data-a="st" data-iid="${esc(it.id)}" data-v="${k}" aria-pressed="${s===k}" title="${STATUS[k].label}" ${ro ? 'disabled' : ''}>${STATUS[k].sym}</button>`).join('')}
      </div>
      ${ro ? '' : `<button class="obs-b ${obs ? 'has' : ''}" data-a="obs" data-iid="${esc(it.id)}" title="Escrever observação deste item">${obs ? '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg> Obs' : '+ Obs'}</button>`}
    </div>
  </div>`;
}

// Editor compartilhado: modelo fixo e itens de um show
function editor(secoes, tipo){
  const cf = k => S.confirm === k;
  const del = (k, a, extra) => `<button class="ib del ${cf(k) ? 'confirm' : ''}" data-a="${a}" ${extra} data-k="${k}" title="Remover">${cf(k) ? 'Remover?' : '✕'}</button>`;
  const secs = (secoes || []).map((sec, si) => `
  <section class="sec">
    <div class="sec-h">
      <input type="text" id="s-${esc(sec.id)}" data-a="ren-sec" data-sid="${esc(sec.id)}" value="${esc(val('s-' + sec.id, sec.titulo))}" aria-label="Nome da seção">
      <button class="ib" data-a="mv-sec" data-sid="${esc(sec.id)}" data-d="-1" title="Subir" ${si === 0 ? 'disabled' : ''}>↑</button>
      <button class="ib" data-a="mv-sec" data-sid="${esc(sec.id)}" data-d="1" title="Descer" ${si === secoes.length - 1 ? 'disabled' : ''}>↓</button>
      ${del('sec-' + sec.id, 'del-sec', `data-sid="${esc(sec.id)}"`)}
    </div>
    ${(sec.grupos || []).map((g, gi) => `
      <div class="grp-h">
        <input type="text" id="g-${esc(g.id)}" data-a="ren-grp" data-gid="${esc(g.id)}" value="${esc(val('g-' + g.id, g.titulo))}" placeholder="Nome do nível ou bloco (pode ficar vazio)" aria-label="Nome do nível">
        <button class="ib" data-a="mv-grp" data-gid="${esc(g.id)}" data-d="-1" title="Subir" ${gi === 0 ? 'disabled' : ''}>↑</button>
        <button class="ib" data-a="mv-grp" data-gid="${esc(g.id)}" data-d="1" title="Descer" ${gi === sec.grupos.length - 1 ? 'disabled' : ''}>↓</button>
        ${del('grp-' + g.id, 'del-grp', `data-gid="${esc(g.id)}"`)}
      </div>
      ${(g.itens || []).map((it, ii) => `
        <div class="ed-item">
          <span class="num">${ii + 1}</span>
          <div class="ed-f">
            <input type="text" id="t-${esc(it.id)}" data-a="ren-item" data-iid="${esc(it.id)}" data-f="texto" value="${esc(val('t-' + it.id, it.texto))}" aria-label="Texto do item">
            <input type="text" class="nota-in" id="n-${esc(it.id)}" data-a="ren-item" data-iid="${esc(it.id)}" data-f="nota" value="${esc(val('n-' + it.id, it.nota))}" placeholder="Nota fixa em vermelho, ex.: (conforme necessidade do evento)" aria-label="Nota fixa">
            ${servidor && (S.montagens || []).length ? `<select class="lig-sel" id="lm-${esc(it.id)}" data-a="lig-mont" data-iid="${esc(it.id)}" aria-label="Modelo de montagem do item">
              <option value="">Sem modelo de montagem</option>
              ${montagensOrdenadas().map(m => `<option value="${esc(m.id)}" ${it.montagem === m.id ? 'selected' : ''}>Montagem: ${esc(m.titulo)} (Nível ${m.nivel})</option>`).join('')}
            </select>` : ''}
          </div>
          <div class="ed-btns">
            <button class="ib" data-a="mv-item" data-iid="${esc(it.id)}" data-d="-1" title="Subir" ${ii === 0 ? 'disabled' : ''}>↑</button>
            <button class="ib" data-a="mv-item" data-iid="${esc(it.id)}" data-d="1" title="Descer" ${ii === g.itens.length - 1 ? 'disabled' : ''}>↓</button>
            ${del('item-' + it.id, 'del-item', `data-iid="${esc(it.id)}"`)}
          </div>
        </div>`).join('')}
      ${S.addForm === g.id ? `
        <form class="addbar" data-gid="${esc(g.id)}" id="f-add">
          <input type="text" id="add-txt" placeholder="Novo item, ex.: Montar balcão de credenciamento extra" value="${esc(val('add-txt'))}" required>
          <input type="text" id="add-nota" class="nota-in" style="color:var(--note)" placeholder="Nota fixa (opcional)" value="${esc(val('add-nota'))}">
          <div class="row">
            ${tipo === 'check' ? `<label class="chk"><input type="checkbox" id="add-modelo" ${S.draft['add-modelo'] ? 'checked' : ''}> Adicionar também ao modelo (próximos shows)</label>` : ''}
            <span class="grow"></span>
            <button type="button" class="btn ghost" data-a="cancel">Cancelar</button>
            <button type="submit" class="btn pri">Adicionar</button>
          </div>
        </form>`
      : `<div class="addbar"><div><button class="link" data-a="add-item" data-gid="${esc(g.id)}">+ Adicionar item${g.titulo ? ' em ' + esc(g.titulo) : ''}</button></div></div>`}
    `).join('')}
    <div class="addbar"><div><button class="link" data-a="add-grp" data-sid="${esc(sec.id)}">+ Adicionar nível / bloco em ${esc(sec.titulo || 'esta seção')}</button></div></div>
  </section>`).join('');
  return `${secs}<div><button class="btn" data-a="add-sec">+ Adicionar seção</button></div>`;
}

function viewModelo(){
  if (S.modelo === undefined) return `${avisoCarga()}<div class="panel empty">Carregando modelo…</div>`;
  const intro = `<div class="head"><h1>Modelo fixo</h1>
    <p class="muted" style="margin:0;max-width:62ch">Estes são os itens que entram em todo checklist novo. Mudanças aqui valem para os próximos shows e não mexem nos checklists já criados. A nota fixa aparece em vermelho, como no papel.</p></div>`;
  if (!podeMudar()) return `${intro}<div class="notice">Você pode ver o modelo, mas só o administrador pode mudar os itens.</div>${modeloLeitura()}${acessoInfo()}`;
  return `${avisoCarga()}${intro}${editor(S.modelo?.secoes || [], 'modelo')}`;
}

function modeloLeitura(){
  return (S.modelo?.secoes || []).map(sec => `<section class="sec"><div class="sec-h">${esc(sec.titulo)}</div>${(sec.grupos || []).map(g => `
    ${g.titulo ? `<div class="grp-h">${esc(g.titulo)}<span class="cnt">${(g.itens || []).length} itens</span></div>` : ''}
    ${(g.itens || []).map((it, i) => `<div class="item"><span class="num">${i + 1}</span><div class="txt" style="padding-top:0">${esc(it.texto)} ${it.nota ? `<span class="nota">${esc(it.nota)}</span>` : ''}</div></div>`).join('')}`).join('')}</section>`).join('');
}

// ---------- estrutura (modelo ou show) ----------
function estrutura(tipo){ return clone(tipo === 'modelo' ? (S.modelo?.secoes || []) : (atual()?.secoes || [])); }
function salvarEstrutura(tipo, secoes){
  if (tipo === 'modelo'){
    S.modelo = { ...(S.modelo || {}), secoes };
    render();
    return gravar('config/modelo', () => db.doc('config/modelo').set({ secoes, atualizadoEm: Date.now() }));
  }
  const ck = atual(); if (!ck) return;
  return gravar('checklists/' + ck.id, () => db.doc('checklists/' + ck.id).update({ secoes }));
}
function acharGrupo(secoes, gid){ for (const s of secoes) for (const g of (s.grupos||[])) if (g.id === gid) return { s, g }; return null; }
function acharItem(secoes, iid){ for (const s of secoes) for (const g of (s.grupos||[])) { const i = (g.itens||[]).findIndex(x => x.id === iid); if (i >= 0) return { g, i }; } return null; }
function mover(arr, i, d){ const j = i + d; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; }
const tipoAtual = () => S.view === 'modelo' ? 'modelo' : 'check';

// ---------- ações ----------
function precisaConfirmar(k){ if (S.confirm === k) { S.confirm = null; return false; } S.confirm = k; render(); return true; }

app.addEventListener('click', ev => {
  const b = ev.target.closest('[data-a]'); if (!b || b.disabled) return;
  const a = b.dataset.a, t = tipoAtual();
  if (b.tagName === 'INPUT') return;
  if (!['del-sec', 'del-grp', 'del-item', 'del-ck', 'mont-excluir', 'foto-del'].includes(a) && S.confirm) S.confirm = null;
  switch (a){
    case 'go-lista': irPara('lista'); break;
    // montagens
    case 'go-mont-det': abrirMontagem(b.dataset.mid, S.view === 'check' ? 'check' : 'montagens'); break;
    case 'mont-voltar': { const v = S.voltar?.view || 'montagens'; S.mEdit = false; S.ferramenta = null; S.linhaAtual = []; S.view = v === 'check' && !atual() ? 'montagens' : v; render(); window.scrollTo(0, 0); break; }
    case 'mont-novo': editarMontagem(true); break;
    case 'mont-editar': editarMontagem(false); break;
    case 'mont-cancelar': S.mEdit = false; S.ferramenta = null; S.linhaAtual = []; if (S.mNovo) { S.mNovo = false; S.view = 'montagens'; } render(); break;
    case 'mont-salvar': salvarMontagem(); break;
    case 'mont-excluir': {
      if (precisaConfirmar('del-mont')) return;
      const id = S.montId; S.mEdit = false; S.montagens = (S.montagens || []).filter(m => m.id !== id); S.view = 'montagens';
      gravar('montagens/' + id, () => db.doc('montagens/' + id).delete()).then(() => toast('Modelo excluído'));
      render(); break; }
    case 'nivel-planta': S.nivelPlanta = +b.dataset.v; S.zoom = 1; render(); break;
    case 'zoom': { const z = [1, 1.5, 2, 3, 4], i = z.indexOf(S.zoom); S.zoom = z[Math.max(0, Math.min(z.length - 1, (i < 0 ? 0 : i) + (+b.dataset.d)))]; render(); break; }
    case 'cor': S.mDraft.cor = b.dataset.v; render(); break;
    case 'mat-add': S.mDraft.materiais = [...(S.mDraft.materiais || []), { id: uid(), nome: 'Grade de contenção', material: 'ferro', capa: 'com', qtd: 0 }]; render(); break;
    case 'mat-del': S.mDraft.materiais = (S.mDraft.materiais || []).filter(x => x.id !== b.dataset.v); render(); break;
    case 'foto-del': { if (precisaConfirmar(b.dataset.k)) return; S.mDraft.fotos = (S.mDraft.fotos || []).filter(f => f !== b.dataset.v); render(); break; }
    case 'ferr': S.ferramenta = S.ferramenta === b.dataset.v ? null : b.dataset.v; if (S.ferramenta !== 'linha') S.linhaAtual = []; render(); break;
    case 'linha-ok': if (S.linhaAtual.length >= 2) S.mDraft.desenho.linhas.push(S.linhaAtual); S.linhaAtual = []; render(); break;
    case 'desfazer': {
      const d = S.mDraft.desenho;
      if (S.linhaAtual.length) S.linhaAtual.pop();
      else if (S.ferramenta === 'ponto' && d.pontos.length) d.pontos.pop();
      else if (d.linhas.length) d.linhas.pop();
      else d.pontos.pop();
      render(); break; }
    case 'limpar-des': S.mDraft.desenho = { linhas: [], pontos: [] }; S.linhaAtual = []; render(); break;
    case 'planta-svg': cliqueNaPlanta(ev, b); break;
    case 'pedir-admin': S.pedirSenha = true; render(); { const el = document.getElementById('senha'); if (el) el.focus(); } break;
    case 'cancel-senha': S.pedirSenha = false; render(); break;
    case 'sair': servidor.sair().finally(() => location.reload()); break;
    case 'abrir': S.openId = b.dataset.id; S.editando = false; S.filtro = 'todos'; S.copyText = null; S.obsAbertas.clear(); irPara('check'); break;
    case 'filtro': S.filtro = b.dataset.v; render(); break;
    case 'editar': S.editando = !S.editando; S.addForm = null; render(); break;
    case 'st': {
      const ck = atual(); if (!ck) return;
      const iid = b.dataset.iid, atualS = ck.estado?.[iid]?.s || '';
      const novo = atualS === b.dataset.v ? '' : b.dataset.v;
      gravar('checklists/' + ck.id, () => db.doc('checklists/' + ck.id).update({ estado: { [iid]: { s: novo } } }));
      break; }
    case 'obs': {
      const iid = b.dataset.iid;
      if (S.obsAbertas.has(iid) && !(('o-' + iid) in S.draft) && !atual()?.estado?.[iid]?.obs) S.obsAbertas.delete(iid); else S.obsAbertas.add(iid);
      render();
      const el = document.getElementById('o-' + iid); if (el) el.focus();
      break; }
    case 'finalizar': { const ck = atual(); gravar('checklists/' + ck.id, () => db.doc('checklists/' + ck.id).update({ finalizado: !ck.finalizado })); break; }
    case 'del-ck': {
      if (precisaConfirmar('del-ck')) return;
      const id = S.openId; irPara('lista');
      gravar('checklists/' + id, () => db.doc('checklists/' + id).delete()).then(() => toast('Checklist excluído'));
      break; }
    case 'cancel': S.confirm = null; S.addForm = null; delete S.draft['add-txt']; delete S.draft['add-nota']; delete S.draft['add-modelo']; render(); break;
    case 'copiar': copiar(); break;
    case 'baixar': baixar(); break;
    case 'add-item': S.addForm = b.dataset.gid; render(); { const el = document.getElementById('add-txt'); if (el) el.focus(); } break;
    case 'add-grp': { const sec = estrutura(t); const s = sec.find(x => x.id === b.dataset.sid); s.grupos = s.grupos || []; s.grupos.push({ id: uid(), titulo: 'Novo nível', itens: [] }); salvarEstrutura(t, sec); break; }
    case 'add-sec': { const sec = estrutura(t); sec.push({ id: uid(), titulo: 'Nova seção', grupos: [{ id: uid(), titulo: '', itens: [] }] }); salvarEstrutura(t, sec); break; }
    case 'mv-sec': { const sec = estrutura(t); mover(sec, sec.findIndex(x => x.id === b.dataset.sid), +b.dataset.d); salvarEstrutura(t, sec); break; }
    case 'mv-grp': { const sec = estrutura(t); const r = acharGrupo(sec, b.dataset.gid); mover(r.s.grupos, r.s.grupos.indexOf(r.g), +b.dataset.d); salvarEstrutura(t, sec); break; }
    case 'mv-item': { const sec = estrutura(t); const r = acharItem(sec, b.dataset.iid); mover(r.g.itens, r.i, +b.dataset.d); salvarEstrutura(t, sec); break; }
    case 'del-sec': { if (precisaConfirmar(b.dataset.k)) return; const sec = estrutura(t).filter(x => x.id !== b.dataset.sid); salvarEstrutura(t, sec); break; }
    case 'del-grp': { if (precisaConfirmar(b.dataset.k)) return; const sec = estrutura(t); const r = acharGrupo(sec, b.dataset.gid); r.s.grupos = r.s.grupos.filter(g => g !== r.g); salvarEstrutura(t, sec); break; }
    case 'del-item': { if (precisaConfirmar(b.dataset.k)) return; const sec = estrutura(t); const r = acharItem(sec, b.dataset.iid); r.g.itens.splice(r.i, 1); salvarEstrutura(t, sec); break; }
  }
});
document.getElementById('tabs').addEventListener('click', ev => {
  const b = ev.target.closest('[data-a]'); if (!b) return;
  irPara(b.dataset.a === 'go-modelo' ? 'modelo' : b.dataset.a === 'go-mont' ? 'montagens' : 'lista');
});
function irPara(v){ S.view = v; S.confirm = null; S.addForm = null; S.copyText = null; S.mEdit = false; S.ferramenta = null; S.linhaAtual = []; S.zoom = 1; render(); window.scrollTo(0, 0); }

const obsTimers = {};
app.addEventListener('input', ev => {
  const el = ev.target; if (!el.id) return;
  if (el.id === 'n-evento') { S.novo.evento = el.value; return; }
  if (el.id === 'n-data') { S.novo.data = el.value; return; }
  if (el.id === 'n-resp') { S.novo.resp = el.value; return; }
  if (el.type === 'checkbox') { S.draft[el.id] = el.checked; return; }
  if (el.dataset.mf && S.mDraft) { S.mDraft[el.dataset.mf] = el.value; return; }

  if (el.dataset.mat && S.mDraft) { const x = (S.mDraft.materiais || []).find(y => y.id === el.dataset.mat); if (x) x[el.dataset.matf] = el.value; return; }

    if (a === 'ren-item') { const r = acharItem(sec, el.dataset.iid); if (r) { if (el.dataset.f === 'texto' && !v) { toast('O item precisa de um texto'); el.value = r.g.itens[r.i].texto; delete S.draft[el.id]; return; } r.g.itens[r.i][el.dataset.f] = v; } }
    delete S.draft[el.id];

});
function salvarObs(iid, v){ const ck = atual(); if (!ck) return Promise.resolve(); return gravar('checklists/' + ck.id, () => db.doc('checklists/' + ck.id).update({ estado: { [iid]: { obs: (v || '').trim() } } })); }
function salvarObsGeral(v){ const ck = atual(); if (!ck) return Promise.resolve(); return gravar('checklists/' + ck.id, () => db.doc('checklists/' + ck.id).update({ obsGeral: v || '' })); }

app.addEventListener('submit', ev => {

function criar(){
  const evento = S.novo.evento.trim();
  if (!evento) { toast('Digite o nome do show'); return; }
  if (!itensDe(S.modelo?.secoes).length) { toast('O modelo está vazio'); return; }
  const ref = db.collection('checklists').doc();
  const doc = { evento, data: S.novo.data, responsavel: S.novo.resp.trim(), criadoEm: Date.now(), finalizado: false, obsGeral: '', secoes: clone(S.modelo.secoes), estado: {} };
  gravar('checklists/' + ref.id, () => ref.set(doc)).then(() => { S.novo = { evento:'', data:'', resp:'' }; });

function adicionarItem(gid){
  const texto = (S.draft['add-txt'] || '').trim();
  if (!texto) { toast('Digite o texto do item'); return; }
  const item = { id: uid(), texto, nota: (S.draft['add-nota'] || '').trim() };
  const t = tipoAtual();
  const sec = estrutura(t); const r = acharGrupo(sec, gid); if (!r) return;

  const tambemModelo = t === 'check' && S.draft['add-modelo'];

function resumo(ck){
  const c = contar(ck);
  const L = [];
  L.push('CHECKLIST OPERACIONAL – FARMASI ARENA');
  L.push(`Show: ${ck.evento}${ck.data ? ' · ' + fmtData(ck.data) : ''}${ck.responsavel ? ' · Resp.: ' + ck.responsavel : ''}`);
  L.push(`✓ ${c.ok} feitos · ✗ ${c.nao} não feitos · N/A ${c.na} · ${c.vazio} sem marcação (${c.pct}%)`);
  const pend = [], obs = [];
  (ck.secoes||[]).forEach(s => (s.grupos||[]).forEach(g => (g.itens||[]).forEach(it => {
    const e = ck.estado?.[it.id] || {}, onde = [s.titulo, g.titulo].filter(Boolean).join(' › ');
    if (e.s === 'nao' || !e.s) pend.push(`• [${onde}] ${it.texto} — ${e.s === 'nao' ? 'NÃO FEITO' : 'sem marcação'}${e.obs ? ' (obs: ' + e.obs + ')' : ''}`);
    else if (e.obs) obs.push(`• [${onde}] ${it.texto} — obs: ${e.obs}`);
  })));
  if (pend.length) { L.push('', 'PENDÊNCIAS', ...pend); }
  if (obs.length) { L.push('', 'OBSERVAÇÕES', ...obs); }
  const mat = materialDoShow(ck);
  if (mat.linhas.length) { L.push('', `MATERIAL DO SHOW (${mat.total} peças)`, ...mat.linhas.map(([k, q]) => `• ${q} × ${k}`)); }
  if (ck.obsGeral) { L.push('', 'OBSERVAÇÕES GERAIS', ck.obsGeral); }
  return L.join('\n');
}
function copiar(){
  const ck = atual(); if (!ck) return;

  const falhou = () => { S.copyText = txt; render(); const el = document.getElementById('copy-fallback'); if (el) { el.focus(); el.select(); } };
  try { navigator.clipboard.writeText(txt).then(() => { S.copyText = null; toast('Resumo copiado. É só colar no WhatsApp ou e-mail.'); }, falhou); } catch (_) { falhou(); }
}

// ---------- modelos de montagem ----------
const CORES = ['#e11518', '#1d4ed8', '#15803d', '#b45309', '#7c3aed', '#0e7490', '#be185d', '#4d7c0f'];
const NOMES_GRADE = ['Grade de contenção', 'Grade de fechamento', 'Barricada', 'Gradil', 'Unifila'];
const fotoUrl = nome => 'api/arquivo/fotos/' + encodeURIComponent(nome);
const montagem = id => (S.montagens || []).find(m => m.id === id);
const montagensOrdenadas = () => [...(S.montagens || [])].sort((a, b) => (a.nivel - b.nivel) || String(a.titulo).localeCompare(String(b.titulo), 'pt-BR'));
function matLabel(m){
  const det = [m.material === 'inox' ? 'inox' : m.material === 'ferro' ? 'ferro' : '', m.capa === 'com' ? 'com capa' : m.capa === 'sem' ? 'sem capa' : ''].filter(Boolean).join(', ');
  return (m.nome || 'Grade') + (det ? ` (${det})` : '');
}
const qtdNoShow = (ck, mid, mat) => { const v = ck?.qtdShow?.[mid]?.[mat.id]; return Number.isFinite(v) ? v : (Number(mat.qtd) || 0); };
function resumoMont(m, ck){
  const tot = (m.materiais || []).reduce((s, x) => s + (ck ? qtdNoShow(ck, m.id, x) : (Number(x.qtd) || 0)), 0);
  return tot ? `${tot} ${tot === 1 ? 'peça' : 'peças'}` : 'sem material';
}
// Itens (do modelo ou de um show) ligados a uma montagem
function itensLigados(secoes, mid){
  const out = [];
  (secoes || []).forEach(s => (s.grupos || []).forEach(g => (g.itens || []).forEach((it, i) => { if (it.montagem === mid) out.push({ onde: [s.titulo, g.titulo].filter(Boolean).join(' › '), n: i + 1, texto: it.texto, id: it.id }); })));
  return out;
}
// Soma o material das montagens ligadas aos itens do show (item marcado N/A não entra)
function materialDoShow(ck){
  const mids = new Set();
  itensDe(ck.secoes).forEach(it => { if (it.montagem && montagem(it.montagem) && ck.estado?.[it.id]?.s !== 'na') mids.add(it.montagem); });
  const soma = new Map();
  mids.forEach(mid => (montagem(mid).materiais || []).forEach(x => {
    const q = qtdNoShow(ck, mid, x); if (!q) return;
    const k = matLabel(x); soma.set(k, (soma.get(k) || 0) + q);
  }));
  const linhas = [...soma.entries()].sort((a, b) => b[1] - a[1]);
  return { linhas, total: linhas.reduce((s, [, q]) => s + q, 0), montagens: mids.size };
}

function plantaHTML(nivel, lista, editavel){
  const pl = S.plantas?.[nivel];

  const pt = p => `${(p[0] * W).toFixed(1)},${(p[1] * H).toFixed(1)}`;
  const desenhar = (d, cor, fraco) => [
    ...(d?.linhas || []).map(l => `<polyline points="${l.map(pt).join(' ')}" fill="none" stroke="${cor}" stroke-width="${fraco ? 3 : 6}" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" opacity="${fraco ? .45 : .95}"/>`),
    ...(d?.pontos || []).map(p => `<circle cx="${(p[0] * W).toFixed(1)}" cy="${(p[1] * H).toFixed(1)}" r="${fraco ? 6 : 9}" fill="${cor}" stroke="#fff" stroke-width="2" vector-effect="non-scaling-stroke" opacity="${fraco ? .5 : 1}"/>`),
  ].join('');
  let svg = lista.map(m => desenhar(m.desenho, m.cor || CORES[0], m.fraco)).join('');

  }
  return `<div class="planta">
    <div class="planta-ctrl">
      <span class="small muted">Nível ${nivel}</span><span class="grow"></span>
      <button class="ib" data-a="zoom" data-d="-1" title="Diminuir" ${S.zoom <= 1 ? 'disabled' : ''}>−</button>

      <img src="api/arquivo/plantas/${esc(pl.arquivo)}" alt="Planta do Nível ${nivel} da Farmasi Arena" draggable="false">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" ${editavel && S.ferramenta ? `data-a="planta-svg" class="desenhando"` : ''}>${svg}</svg>
    </div></div>
  </div>`;
}

function editarMontagem(novo){
  if (novo) {
    const usadas = new Set((S.montagens || []).map(m => m.cor));
    S.mDraft = { id: 'm' + Date.now().toString(36) + uid(), titulo: '', nivel: S.nivelPlanta, descricao: '', cor: CORES.find(c => !usadas.has(c)) || CORES[0], fotos: [], materiais: [{ id: uid(), nome: 'Grade de contenção', material: 'ferro', capa: 'com', qtd: 0 }], desenho: { linhas: [], pontos: [] }, criadoEm: Date.now() };
    S.montId = S.mDraft.id; S.voltar = { view: 'montagens' }; S.view = 'montagem';
  } else {
    const m = montagem(S.montId); if (!m) return;
    S.mDraft = clone(m); S.mDraft.desenho = S.mDraft.desenho || { linhas: [], pontos: [] };
  }
  S.mNovo = !!novo; S.mEdit = true; S.ferramenta = null; S.linhaAtual = []; S.zoom = 1; S.confirm = null;
  render(); window.scrollTo(0, 0);
}
function salvarMontagem(){
  const d = clone(S.mDraft);
  if (!String(d.titulo || '').trim()) { toast('Dê um nome para a montagem'); return; }
  if (S.linhaAtual.length >= 2) d.desenho.linhas.push(S.linhaAtual);
  d.titulo = d.titulo.trim(); d.nivel = Number(d.nivel) || 0;
  d.materiais = (d.materiais || []).map(x => ({ ...x, nome: String(x.nome || '').trim(), qtd: Math.max(0, Math.round(Number(x.qtd) || 0)) }));
  d.atualizadoEm = Date.now();
  const { id, ...corpo } = d;
  const novo = S.mNovo;
  S.montagens = [...(S.montagens || []).filter(m => m.id !== id), { id, ...corpo }];
  S.mEdit = false; S.mNovo = false; S.ferramenta = null; S.linhaAtual = [];
  gravar('montagens/' + id, () => db.doc('montagens/' + id).set(corpo)).then(() => toast(novo ? 'Modelo criado' : 'Modelo salvo'));
  render(); window.scrollTo(0, 0);
}
// Diminui a foto no próprio aparelho antes de enviar
async function reduzir(file, max, tipo, q){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, falha) => { const i = new Image(); i.onload = () => ok(i); i.onerror = falha; i.src = url; });
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(ok => c.toBlob(ok, tipo, q));
    return { blob, w: c.width, h: c.height };
  } finally { URL.revokeObjectURL(url); }
}
async function enviarArquivo(metodo, url, blob){
  const r = await fetch(url, { method: metodo, body: blob, headers: { 'content-type': blob.type }, credentials: 'same-origin' });
  if (r.status === 401) { S.pedirSenha = true; render(); throw new Error('Entre de novo com a senha'); }
  if (r.status === 403) throw new Error('Só o administrador pode enviar arquivos');
  if (r.status === 413) throw new Error('Arquivo grande demais');
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).erro || 'Não foi possível enviar');
  return r.json();
}
async function enviarFotos(files){
  for (const f of files) {
    S.enviando = (S.enviando || 0) + 1; render();
    try {
      const { blob } = await reduzir(f, 1600, 'image/jpeg', 0.82);
      const { arquivo } = await enviarArquivo('POST', 'api/fotos', blob);
      if (S.mDraft) { S.mDraft.fotos = [...(S.mDraft.fotos || []), arquivo]; }
    } catch (e) { toast(e.message || 'Não foi possível enviar a foto'); }
    S.enviando--; render();
  }
}
async function enviarPlanta(n, file){
  toast('Enviando a planta do Nível ' + n + '…');
  try {
    const { blob, w, h } = await reduzir(file, 3200, 'image/webp', 0.86);
    await enviarArquivo('PUT', `api/plantas/${n}?w=${w}&h=${h}`, blob);
    await servidor.recarregar();
    toast('Planta do Nível ' + n + ' enviada');
  } catch (e) { toast(e.message || 'Não foi possível enviar a planta'); }
}
function cliqueNaPlanta(ev, svg){
  const r = svg.getBoundingClientRect();
  const p = [Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width)), Math.min(1, Math.max(0, (ev.clientY - r.top) / r.height))].map(v => Math.round(v * 10000) / 10000);
  if (S.ferramenta === 'ponto') S.mDraft.desenho.pontos.push(p);
  else if (S.ferramenta === 'linha') S.linhaAtual.push(p);
  render();
}

// ---------- servidor próprio (Coolify) ----------
// Mesmo formato do banco do claude.ai, para o resto da página não precisar saber onde está rodando
function dbDoServidor(){
  let base = { config: {}, checklists: {}, montagens: {} }, pend = 0, querRecarregar = false, carregou = false;
  const ouvintes = new Set();
  const avisar = () => ouvintes.forEach(f => f());
  const meta = () => ({ fromCache: false, hasPendingWrites: pend > 0 });
  const mesclar = (a, b) => { for (const k in b) { const v = b[k]; if (v && typeof v === 'object' && !Array.isArray(v) && a[k] && typeof a[k] === 'object' && !Array.isArray(a[k])) mesclar(a[k], v); else a[k] = v; } return a; };
  async function api(metodo, url, corpo){
    const r = await fetch(url, { method: metodo, headers: corpo ? { 'content-type': 'application/json' } : {}, body: corpo ? JSON.stringify(corpo) : undefined, credentials: 'same-origin', cache: 'no-store' });
    if (r.status === 401) { S.pedirSenha = true; render(); throw { code: 'sem_senha' }; }
    if (r.status === 413) throw { code: 'quota_exceeded' };
    if (r.status === 400) throw { code: 'invalid_argument' };
    if (r.status === 403) throw { code: 'proibido' };
    if (!r.ok) throw { code: 'unavailable' };
    return r.status === 204 ? null : r.json();
  }
  async function recarregar(){
    if (pend) { querRecarregar = true; return; }
    const d = await api('GET', 'api/dados');
    if (pend) { querRecarregar = true; return; }
    base = { config: d.config || {}, checklists: d.checklists || {}, montagens: d.montagens || {} }; carregou = true;
    if (S.papel !== (d.papel || null)) { S.papel = d.papel || null; S.editando = false; render(); }
    avisar();
  }
  function escrever(metodo, col, id, corpo, local){
    local(); avisar(); pend++;
    return api(metodo, `api/doc/${col}/${encodeURIComponent(id)}`, corpo)
      .catch(e => { querRecarregar = true; throw e; })
      .finally(() => { pend--; if (!pend && querRecarregar) { querRecarregar = false; recarregar().catch(() => {}); } });
  }
  function ouvir(f){ ouvintes.add(f); f(); return () => ouvintes.delete(f); }
  function doc(path){
    const [col, id] = path.split('/');
    return {
      id, path,
      set: d => escrever('PUT', col, id, d, () => { base[col] = base[col] || {}; base[col][id] = clone(d); }),
      update: d => escrever('PATCH', col, id, d, () => { base[col] = base[col] || {}; base[col][id] = mesclar(base[col][id] || {}, clone(d)); }),
      delete: () => escrever('DELETE', col, id, null, () => { delete base[col][id]; }),
      onSnapshot: next => ouvir(() => { if (!carregou) return; const v = (base[col] || {})[id]; next({ id, exists: !!v, data: () => v, metadata: meta() }); })
    };
  }
  function collection(col){
    const onSnapshot = next => ouvir(() => {
      if (!carregou) return;
      const docs = Object.entries(base[col] || {}).map(([id, v]) => ({ id, exists: true, data: () => v, metadata: meta() }))
        .sort((a, b) => (b.data().criadoEm || 0) - (a.data().criadoEm || 0));
      next({ docs, size: docs.length, empty: !docs.length, metadata: meta() });
    });
    return { path: col, doc: id => doc(col + '/' + (id || 'c' + Date.now().toString(36) + uid())), orderBy: () => ({ onSnapshot }), onSnapshot };
  }
  function ligarAoVivo(){
    try { const es = new EventSource('api/eventos'); es.onmessage = () => recarregar().catch(() => {}); } catch (_) {}
    document.addEventListener('visibilitychange', () => { if (!document.hidden) recarregar().catch(() => {}); });
    setInterval(() => { if (!document.hidden) recarregar().catch(() => {}); }, 60000);
  }
  return { doc, collection, recarregar, ligarAoVivo, entrar: senha => api('POST', 'api/entrar', { senha }), sair: () => api('POST', 'api/sair') };
}
const baixarNoNavegador = {
  save({ filename, data }){
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([data], { type: 'text/html;charset=utf-8' }));
    a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    return Promise.resolve({ status: 'saved' });
  }
};

app.addEventListener('submit', ev => {
  if (ev.target.id !== 'f-senha') return;
  ev.preventDefault();
  const senha = document.getElementById('senha').value;
  servidor.entrar(senha).then(() => { S.pedirSenha = false; iniciarServidor(); }, e => { if (e && e.code === 'sem_senha') toast('Senha errada'); else toast('Sem conexão com o servidor'); });
});
let servidor = null, servidorLigado = false;
function iniciarServidor(){
  servidor.recarregar().then(() => {
    if (!servidorLigado) { servidorLigado = true; servidor.ligarAoVivo(); ouvirDados(); }
  }, e => { if (e && e.code !== 'sem_senha') { S.erro = 'Não foi possível falar com o servidor. Verifique a internet e recarregue a página.'; render(); } });
}

// ---------- conexão com os dados ----------
render();
(async () => {
  const c = window.claude;
  if (!c || !c.use) {
    servidor = dbDoServidor(); db = servidor; dl = baixarNoNavegador;
    iniciarServidor();
    return;
  }
  const [d, u, dw] = await Promise.all([c.use('db'), c.use('user').catch(() => null), c.use('downloads').catch(() => null)]);
  db = d; dl = dw;
  if (!db) { S.semDb = true; render(); return; }
  if (u) { try { const pode = await u.can('data.write'); if (pode === false) canWrite = false; } catch(_){} }
  ouvirDados();
})();
function ouvirDados(){
  const timer = setTimeout(() => { S.lento = true; render(); }, 10000);
  let ok1 = false, ok2 = false;
  const pronto = (meta) => { if (meta && !meta.fromCache) { if (ok1 && ok2) { clearTimeout(timer); S.lento = false; } } };
  db.doc('config/modelo').onSnapshot(snap => {
    S.modelo = snap.exists ? snap.data() : null;
    if (!snap.metadata.fromCache) ok1 = true; pronto(snap.metadata); render();
  }, e => { clearTimeout(timer); S.erro = 'Não foi possível carregar o modelo.'; if (S.modelo === undefined) S.modelo = null; render(); });
  db.collection('checklists').orderBy('criadoEm', 'desc').onSnapshot(snap => {
    S.lista = snap.docs.map(x => ({ id: x.id, ...x.data() }));
    if (!snap.metadata.fromCache) ok2 = true; pronto(snap.metadata);
    if (S.view === 'check' && !atual() && !snap.metadata.fromCache && !snap.metadata.hasPendingWrites) S.view = 'lista';
    render();
  }, e => { clearTimeout(timer); S.erro = 'Não foi possível carregar os checklists.'; if (S.lista === undefined) S.lista = []; render(); });
  db.collection('montagens').orderBy('criadoEm', 'desc').onSnapshot(snap => {
    S.montagens = snap.docs.map(x => ({ id: x.id, ...x.data() }));
    render();
  }, () => { if (S.montagens === undefined) S.montagens = []; });
  db.doc('config/plantas').onSnapshot(snap => { S.plantas = (snap.exists && snap.data()) || {}; render(); }, () => {});
}
})();
